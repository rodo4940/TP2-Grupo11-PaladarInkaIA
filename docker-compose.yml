services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-paladar_inka}
      POSTGRES_USER: ${DATABASE_USER:-paladar_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: {context: ./backend}
    environment:
      APP_NAME: ${APP_NAME:-Paladar Inka API}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
      API_V1_PREFIX: /api/v1
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-paladar_inka}
      DATABASE_USER: ${DATABASE_USER:-paladar_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET seguro en .env}
      TOKEN_TTL_MINUTES: ${TOKEN_TTL_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
  frontend:
    build: {context: ./frontend}
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data: