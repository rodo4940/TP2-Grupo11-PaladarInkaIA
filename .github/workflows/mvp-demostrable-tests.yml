name: MVP Demonstration Tests
on:
  push:
    branches: [feature/mvp-demostrable-qa-20261126]
  pull_request:
    paths:
      - "demo_funcional/**"
      - ".github/workflows/mvp-demostrable-tests.yml"
jobs:
  test-mvp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.115,<1" "httpx>=0.27,<1" "pytest>=8,<10"
      - name: Execute 27 integration tests
        run: PYTHONPATH=. python -m pytest -v demo_funcional/tests --junitxml=demo-mvp-results.xml
      - name: Publish XML evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-test-results
          path: demo-mvp-results.xml
