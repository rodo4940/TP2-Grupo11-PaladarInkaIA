name: Responsive Experience v7 - 91 browser proofs
on:
  push:
    branches: [feature/paladar-v7-responsive-experience, release/paladar-inka-v1-piloto]
    paths:
      - "frontend/src/**"
      - "scripts/e2e_adaptive_v7.py"
      - "scripts/e2e_finance_v8.py"
      - ".github/workflows/responsive-v7.yml"
  pull_request:
    branches: [release/paladar-inka-v1-piloto]
    paths:
      - "frontend/src/**"
      - "scripts/e2e_adaptive_v7.py"
      - ".github/workflows/responsive-v7.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: paladar_responsive_v7
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: temporary_ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qa_user -d paladar_responsive_v7"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: paladar_responsive_v7
      DATABASE_USER: qa_user
      DATABASE_PASSWORD: temporary_ci_only_password
      CORS_ORIGINS: http://127.0.0.1:5173
      VITE_API_URL: http://127.0.0.1:8000
      E2E_FRONTEND_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Generate ephemeral CI secrets
        run: |
          python - <<'PY'
          import os,secrets
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('JWT_SECRET='+secrets.token_hex(32)+'\n')
              f.write('SEED_ADMIN_PASSWORD='+secrets.token_urlsafe(24)+'\n')
          PY
      - name: Install dependencies and typecheck
        run: |
          pip install "./backend[test]" playwright
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Migrate PostgreSQL and insert fictitious menu records
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.seed
      - name: Start real FastAPI and React on CI loopback
        run: |
          (cd backend && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend-responsive-v7.log 2>&1 &)
          (cd frontend && nohup npm run dev -- --host 127.0.0.1 > ../frontend-responsive-v7.log 2>&1 &)
          python - <<'PY'
          import time,urllib.request
          for url in ('http://127.0.0.1:8000/api/v1/ready','http://127.0.0.1:5173'):
              for _ in range(50):
                  try:
                      with urllib.request.urlopen(url,timeout=3) as response:
                          if response.status==200:break
                  except Exception:pass
                  time.sleep(1)
              else:raise RuntimeError('No responde '+url)
          PY
      - name: Populate test sales and customers through real browser flows
        run: python scripts/e2e_browser.py
      - name: Verify 91 real responsive states and exact PNG dimensions
        run: python scripts/e2e_adaptive_v7.py
      - name: Ensure complete 91 screenshot manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          folder=Path('e2e/adaptive-v7')
          d=json.loads((folder/'RESULTADOS_RESPONSIVE_V7.json').read_text())
          assert d['count']==91
          assert len(d['captures'])==91
          assert d['widths']==[320,360,390,430,768,1024,1440]
          assert not d['javascript_errors']
          assert len(list(folder.glob('*.png')))==91
          assert all(not x['metrics']['overflow'] for x in d['captures'])
          print('RESPONSIVE VERIFIED:',d['count'],'PNG',len(d['widths']),'viewports')
          PY
      - name: Capture 16 additional audited cash/refund UI states (v8)
        run: python scripts/e2e_finance_v8.py
      - name: Archive evidence, manifest and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paladar-inka-responsive-v7-91-viewport-png
          if-no-files-found: warn
          path: |
            e2e/adaptive-v7/**
            e2e/finance-v8/**
            backend-responsive-v7.log
            frontend-responsive-v7.log
