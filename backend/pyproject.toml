[project]
name = "paladar-inka-ai-backend"
version = "1.0.0"
description = "API transaccional para pizzeria Paladar del Inka"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "PyJWT>=2.8,<3",
  "argon2-cffi>=23.1,<26"
]
[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-cov>=5,<8"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
[tool.setuptools.packages.find]
include = ["app*"]